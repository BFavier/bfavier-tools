AWSTemplateFormatVersion: '2010-09-09'
Description: Defines a private s3 bucket resource

Parameters:
  BucketName:
    Type: String
    Description: The name of the S3 bucket
  VersioningStatus:
    Type: String
    Default: Disabled
    AllowedValues:
      - Enabled
      - Suspended
      - Disabled
    Description: Specify the versioning status for the S3 bucket
  BucketAccess:
    Type: String
    Default: Private
    AllowedValues:
      - Private
      - Public
    Description: Specify whether the S3 bucket should be private or publicly readable
  WithPublicCloudFront:
    Type: String
    Default: "False"
    AllowedValues:
      - "True"
      - "False"
    Description: If this is enabled, will also create a cloudfront distribution to cache the content globaly. Any content of the s3 bucket will be publicly accessible through it, even if the bucket is private.

Conditions:
  EnableVersioning: !Not [ !Equals [ !Ref VersioningStatus, Disabled ] ]
  IsPublic: !Equals [!Ref BucketAccess, Public]
  CreateCloudFront: !Equals [ !Ref WithPublicCloudFront, "True" ]

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      AccessControl: Private
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration: !If
        - EnableVersioning
        - Status: !Ref VersioningStatus
        - !Ref AWS::NoValue
      PublicAccessBlockConfiguration:
              BlockPublicAcls: !If
                - IsPublic
                - false
                - true
              BlockPublicPolicy: !If
                - IsPublic
                - false
                - true
              IgnorePublicAcls: !If
                - IsPublic
                - false
                - true
              RestrictPublicBuckets: !If
                - IsPublic
                - false
                - true

  PublicReadPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: IsPublic
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicRead
            Effect: Allow
            Principal: '*'
            Action:
              - s3:GetObject
            Resource: !Sub '${Bucket.Arn}/*'

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: CreateCloudFront
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${BucketName}-OAC'
        Description: !Sub 'CloudFront access to ${BucketName}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontReadPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateCloudFront
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub '${Bucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub
                  - 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DistributionId}'
                  - DistributionId: !Ref CloudFrontDistribution

  CloudFrontCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Condition: CreateCloudFront
    Properties:
      CachePolicyConfig:
        Name: CloudFrontCachePolicy
        DefaultTTL: 3600
        MaxTTL: 86400
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: CreateCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt Bucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId:
              !GetAtt CloudFrontOriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: !Ref CloudFrontCachePolicy
        HttpVersion: http2
        PriceClass: PriceClass_100

Outputs:
  BucketName:
    Value: !Ref Bucket

  CloudFrontDistributionId:
    Condition: CreateCloudFront
    Description: CloudFront distribution ID
    Value: !Ref CloudFrontDistribution

  CloudFrontDomainName:
    Condition: CreateCloudFront
    Description: CloudFront distribution domain name
    Value: !GetAtt CloudFrontDistribution.DomainName
